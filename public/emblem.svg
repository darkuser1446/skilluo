<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="s60-flame" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFA048" />
      <stop offset="50%" stop-color="#F07C27" />
      <stop offset="100%" stop-color="#D86312" />
    </linearGradient>
    <linearGradient id="s60-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <linearGradient id="s60-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D325E" />
      <stop offset="100%" stop-color="#151A38" />
    </linearGradient>
    <filter id="s60-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Frame -->
  <polygon points="50,6 90,28 90,72 50,94 10,72 10,28" fill="url(#s60-navy)" stroke="url(#s60-flame)" stroke-width="3.5" stroke-linejoin="round" />
  <polygon points="50,14 83,32 83,68 50,86 17,68 17,32" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Monogram -->
  <path d="M66 32 C66 26 58 24 50 24 C40 24 33 28 33 36 C33 46 64 43 64 54 C64 64 56 68 47 68 C36 68 31 62 31 56" stroke="url(#s60-flame)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="50" r="3.5" fill="url(#s60-gold)" filter="url(#s60-glow)" />

  <!-- Corner nodes -->
  <circle cx="50" cy="6" r="3" fill="#FFA048" />
  <circle cx="90" cy="28" r="3" fill="#FFA048" />
  <circle cx="90" cy="72" r="3" fill="#F07C27" />
  <circle cx="50" cy="94" r="3" fill="#D86312" />
  <circle cx="10" cy="72" r="3" fill="#F07C27" />
  <circle cx="10" cy="28" r="3" fill="#FFA048" />
</svg>
